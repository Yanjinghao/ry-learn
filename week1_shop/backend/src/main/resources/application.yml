server:
  port: 8080

spring:
  application:
    name: week1-shop
  profiles:
    active: local   # 本地默认用 application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/week1_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:changeme}   # 真正密码放到 local
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  # 配置静态资源访问路径, 开发环境前端需要使用代理, 生产环境需要配置nginx
  # 默认是寻找classpath:/static, classpath:/public, classpath:/resources, classpath:/META-INF/resources
  # 所以目前我放在/resources/static目录下, 不用配置
  # web:
  #   resources:
  #     static-locations: file:D:/www/dist/

ry:
  jwt:
    # 至少 32 字符（HS256 要求）
    secret: ${JWT_SECRET:please-change-me-to-32-bytes-min!!}  #week1-shop-jwt-secret-key-32bytes!!放local
    # 过期时间：2 小时（毫秒）
    expire-ms: 7200000
  upload:
    dir: uploads          # 相对 backend 运行目录, 也就是文件放在根目录下的uploads文件夹
    url-prefix: /uploads  # 浏览器访问前缀, 也就是文件的访问路径, 域名+路径

springdoc:
  swagger-ui:
    persist-authorization: true
