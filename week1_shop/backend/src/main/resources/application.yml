server:
  port: 8080

spring:
  application:
    name: week1-shop
  profiles:
    active: local   # 本地默认用 application-local.yml
  datasource:
    url: jdbc:mysql://localhost:3306/week1_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:changeme}   # 真正密码放到 local

ry:
  jwt:
    # 至少 32 字符（HS256 要求）
    secret: ${JWT_SECRET:please-change-me-to-32-bytes-min!!}  #week1-shop-jwt-secret-key-32bytes!!放local
    # 过期时间：2 小时（毫秒）
    expire-ms: 7200000
